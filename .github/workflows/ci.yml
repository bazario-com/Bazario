name: CI

# Runs on every push and PR so problems surface before merge, not after a
# manual `npm test` that someone forgets to run.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  NODE_VERSION: '20'

jobs:
  # --------------------------------------------------------------------------
  # API: lint, type-check, unit tests, a real migration against Postgres, build
  # --------------------------------------------------------------------------
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest

    # A real Postgres service container — this is what catches a broken
    # migration or an invalid schema.prisma before it ever reaches a
    # deployed environment, not just a syntax check.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_ci_password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://marketplace:marketplace_ci_password@localhost:5432/marketplace_test?schema=public
      JWT_ACCESS_SECRET: ci_test_access_secret_do_not_use_in_prod
      JWT_REFRESH_SECRET: ci_test_refresh_secret_do_not_use_in_prod
      COOKIE_SECRET: ci_test_cookie_secret_do_not_use_in_prod
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Using `npm install` rather than `npm ci` because no package-lock.json
      # is committed yet (this repo was scaffolded without registry access —
      # see README). Once you run `npm install` locally once and commit the
      # resulting lockfiles, switch this to `npm ci` and add back
      # `cache: npm` / `cache-dependency-path` on setup-node above for
      # faster, fully-reproducible CI installs.
      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations against a real Postgres instance
        run: npx prisma migrate deploy

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 14

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Web: type-check, lint, build
  # --------------------------------------------------------------------------
  web:
    name: Web (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build
        run: npm run build

  # --------------------------------------------------------------------------
  # Gate: a single required status check for branch protection rules, so
  # "require this check to pass before merge" only needs one name even as
  # the matrix above grows.
  # --------------------------------------------------------------------------
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - name: Fail if any dependency job failed
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.web.result }}" != "success" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
